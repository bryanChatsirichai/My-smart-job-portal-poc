[project]
name = "job-portal-backend"
version = "0.1.0"
description = "Smart Job Portal POC — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.10",
    "httpx>=0.28.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "apscheduler>=3.10.4",
]

[tool.uv]
package = false
