# Optional — not required for the current POC (SQLite is the default).
# Use this in the future when switching to Postgres for production or multi-user workloads.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobportal
      POSTGRES_PASSWORD: jobportal
      POSTGRES_DB: jobportal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
